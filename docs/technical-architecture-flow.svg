<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">CareLink architecture flow</title>
  <desc id="desc">Alternate architecture visualization emphasizing the flow from role-based users through the frontend, API and domain services to MongoDB and external integrations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#1d3d5b"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63a7ff"/><stop offset="1" stop-color="#3678d5"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#51d5bd"/><stop offset="1" stop-color="#159981"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#071321" flood-opacity=".28"/></filter>
    <marker id="arr" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13Z" fill="#9bb9d2"/></marker>
    <marker id="arrt" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13Z" fill="#51d5bd"/></marker>
    <style>
      .title{font:700 40px 'Segoe UI',Arial,sans-serif;fill:#f4f8fc}.sub{font:17px 'Segoe UI',Arial,sans-serif;fill:#afc7db}
      .h{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#17324d}.t{font:15px 'Segoe UI',Arial,sans-serif;fill:#405a72}.white{fill:#f3f8fc}.muted{fill:#afc7db}
      .card{fill:#f8fbff;stroke:#dbe8f3;stroke-width:1.2;rx:19;filter:url(#shadow)}.line{stroke:#9bb9d2;stroke-width:3;fill:none;marker-end:url(#arr)}.live{stroke:#51d5bd;stroke-width:3;fill:none;marker-end:url(#arrt);stroke-dasharray:9 8}
      .cap{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <circle cx="1480" cy="80" r="230" fill="#2c5c7f" opacity=".18"/><circle cx="120" cy="1030" r="290" fill="#278a89" opacity=".12"/>
  <text x="72" y="76" class="title">CareLink</text>
  <text x="72" y="111" class="sub">Technical architecture · request path and live coordination</text>
  <rect x="1320" y="56" width="205" height="39" rx="19" fill="#234b68"/><text x="1422" y="81" text-anchor="middle" class="cap">SYSTEM OVERVIEW</text>

  <!-- Main flow -->
  <text x="72" y="178" class="cap" style="fill:#84baff">01  USER ACCESS</text>
  <rect class="card" x="72" y="203" width="255" height="280"/>
  <rect x="72" y="203" width="255" height="8" rx="4" fill="url(#blue)"/>
  <text x="99" y="251" class="h">Role-based users</text>
  <text x="99" y="290" class="t"><tspan x="99">Patient</tspan><tspan x="99" dy="31">Dispatcher</tspan><tspan x="99" dy="31">Ambulance driver</tspan><tspan x="99" dy="31">Hospital staff</tspan><tspan x="99" dy="31">Pharmacist</tspan></text>
  <path class="line" d="M327 343 H390"/>

  <text x="398" y="178" class="cap" style="fill:#84baff">02  WEB APPLICATION</text>
  <rect class="card" x="398" y="203" width="300" height="280"/>
  <rect x="398" y="203" width="300" height="8" rx="4" fill="url(#blue)"/>
  <text x="426" y="251" class="h">Next.js 16 + React 19</text>
  <text x="426" y="292" class="t"><tspan x="426">App Router pages</tspan><tspan x="426" dy="30">Role-specific dashboards</tspan><tspan x="426" dy="30">Shared components + maps</tspan><tspan x="426" dy="30">Client context and state</tspan></text>
  <rect x="426" y="418" width="243" height="42" rx="12" fill="#eaf3ff"/><text x="547" y="445" text-anchor="middle" class="t" style="font-size:13px">HTTPS · JSON API</text>
  <path class="line" d="M698 343 H765"/>

  <text x="774" y="178" class="cap" style="fill:#51d5bd">03  API + DOMAIN</text>
  <rect class="card" x="774" y="203" width="388" height="280"/>
  <rect x="774" y="203" width="388" height="8" rx="4" fill="url(#teal)"/>
  <text x="802" y="251" class="h">Route handlers + services</text>
  <text x="802" y="289" class="t"><tspan x="802">Auth session + role authorization</tspan><tspan x="802" dy="28">Zod request validation</tspan><tspan x="802" dy="28">SOS offers + atomic acceptance</tspan><tspan x="802" dy="28">Hospital ranking + resource holds</tspan><tspan x="802" dy="28">Confirm · release · expiry · escalation</tspan></text>
  <path class="line" d="M1162 343 H1225"/>

  <text x="1233" y="178" class="cap" style="fill:#ffc46f">04  PERSISTENCE</text>
  <rect class="card" x="1233" y="203" width="295" height="280"/>
  <rect x="1233" y="203" width="295" height="8" rx="4" fill="#f0a33c"/>
  <text x="1261" y="251" class="h">MongoDB</text>
  <text x="1261" y="291" class="t"><tspan x="1261">Users + sessions</tspan><tspan x="1261" dy="30">Hospitals + GeoJSON</tspan><tspan x="1261" dy="30">Resources + holds</tspan><tspan x="1261" dy="30">Operational snapshots</tspan></text>
  <rect x="1261" y="420" width="239" height="40" rx="12" fill="#fff3df"/><text x="1380" y="446" text-anchor="middle" class="t" style="font-size:13px">Atomic writes · indexes</text>

  <!-- Supporting services -->
  <text x="72" y="553" class="cap" style="fill:#51d5bd">SUPPORTING SERVICES</text>
  <rect x="72" y="578" width="435" height="175" rx="18" fill="#193a53" stroke="#315671"/>
  <text x="100" y="620" class="white" style="font:700 19px 'Segoe UI',Arial,sans-serif">Live updates</text>
  <text x="100" y="655" class="muted" style="font:15px 'Segoe UI',Arial,sans-serif"><tspan x="100">MongoDB change stream → SSE endpoint</tspan><tspan x="100" dy="27">Connected dashboards refresh shared state</tspan><tspan x="100" dy="27">Clients refetch after reconnect</tspan></text>

  <rect x="582" y="578" width="435" height="175" rx="18" fill="#193a53" stroke="#315671"/>
  <text x="610" y="620" class="white" style="font:700 19px 'Segoe UI',Arial,sans-serif">Maps + distance</text>
  <text x="610" y="655" class="muted" style="font:15px 'Segoe UI',Arial,sans-serif"><tspan x="610">Leaflet + OpenStreetMap display</tspan><tspan x="610" dy="27">Optional Google Routes travel-time API</tspan><tspan x="610" dy="27">Straight-line ETA fallback</tspan></text>

  <rect x="1092" y="578" width="436" height="175" rx="18" fill="#193a53" stroke="#315671"/>
  <text x="1120" y="620" class="white" style="font:700 19px 'Segoe UI',Arial,sans-serif">Local fallback</text>
  <text x="1120" y="655" class="muted" style="font:15px 'Segoe UI',Arial,sans-serif"><tspan x="1120">Sample seed data for first load</tspan><tspan x="1120" dy="27">Browser localStorage for offline continuity</tspan><tspan x="1120" dy="27">Local changes are not shared cross-device</tspan></text>

  <!-- Realtime connector -->
  <path class="live" d="M1430 483 V525 H289 V568"/>
  <text x="850" y="518" text-anchor="middle" class="cap" style="fill:#51d5bd">LIVE EVENT RETURN PATH</text>

  <!-- Runtime / operations footer -->
  <rect x="72" y="808" width="1456" height="220" rx="22" fill="#f8fbff" filter="url(#shadow)"/>
  <text x="105" y="855" class="h">Runtime and production concerns</text>
  <line x1="560" y1="882" x2="560" y2="998" stroke="#dbe6ef"/><line x1="1040" y1="882" x2="1040" y2="998" stroke="#dbe6ef"/>
  <text x="105" y="897" class="t" style="font-weight:700">Configuration</text>
  <text x="105" y="927" class="t"><tspan x="105">MONGODB_URI</tspan><tspan x="105" dy="24">BETTER_AUTH_SECRET</tspan><tspan x="105" dy="24">Google Routes key (optional)</tspan></text>
  <text x="590" y="897" class="t" style="font-weight:700">Capacity safety</text>
  <text x="590" y="927" class="t"><tspan x="590">Atomic reservation and release</tspan><tspan x="590" dy="24">Expiry worker required in production</tspan><tspan x="590" dy="24">Do not rely on TTL to release inventory</tspan></text>
  <text x="1070" y="897" class="t" style="font-weight:700">Operational gap</text>
  <text x="1070" y="927" class="t"><tspan x="1070">Pharmacist-approved order/stock APIs</tspan><tspan x="1070" dy="24">remain to be completed</tspan><tspan x="1070" dy="24">See docs/remaining-work.md</tspan></text>
  <text x="1528" y="1067" text-anchor="end" class="muted" style="font:13px 'Segoe UI',Arial,sans-serif">Alternate view · CareLink system architecture</text>
</svg>
