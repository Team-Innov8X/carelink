<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">CareLink technical architecture</title>
  <desc id="desc">CareLink system architecture showing role-based browser dashboards, Next.js UI and API, authentication, domain services, MongoDB, SSE updates, and Google Routes integration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8ff"/><stop offset="1" stop-color="#edf5f3"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#718ba1"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#14947e"/></marker>
    <style>
      .title{font:700 38px 'Segoe UI',Arial,sans-serif;fill:#142b45}.sub{font:16px 'Segoe UI',Arial,sans-serif;fill:#587089}
      .box{fill:#fff;stroke:#dce6ef;stroke-width:1.5;rx:18;filter:url(#shadow)}.h{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#17324d}
      .t{font:15px 'Segoe UI',Arial,sans-serif;fill:#405a72}.sm{font:13px 'Segoe UI',Arial,sans-serif;fill:#587089}
      .tag{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#fff;letter-spacing:.6px}.flow{stroke:#718ba1;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .realtime{stroke:#14947e;stroke-width:2.5;fill:none;marker-end:url(#arrowGreen)}.dash{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="url(#bg)"/>
  <text x="80" y="66" class="title">CareLink · Technical Architecture</text>
  <text x="80" y="96" class="sub">Request path, persistence, authentication, live updates, and external integrations</text>

  <!-- Browser clients -->
  <rect class="box" x="60" y="168" width="265" height="575"/>
  <rect x="60" y="168" width="265" height="9" rx="4" fill="#3878d4"/>
  <rect x="84" y="194" width="93" height="22" rx="11" fill="#3878d4"/><text x="130" y="209" text-anchor="middle" class="tag">CLIENTS</text>
  <text x="84" y="251" class="h">Role dashboards</text>
  <text x="84" y="289" class="t"><tspan x="84">Patient</tspan><tspan x="84" dy="31">Dispatcher</tspan><tspan x="84" dy="31">Ambulance driver</tspan><tspan x="84" dy="31">Hospital staff/admin</tspan><tspan x="84" dy="31">Pharmacy</tspan></text>
  <line x1="84" y1="474" x2="300" y2="474" stroke="#e2eaf1"/>
  <text x="84" y="509" class="h" style="font-size:17px">Client state</text>
  <text x="84" y="541" class="sm"><tspan x="84">React context + components</tspan><tspan x="84" dy="24">Built-in sample records</tspan><tspan x="84" dy="24">localStorage fallback</tspan><tspan x="84" dy="24">Fetch /api/data to sync</tspan></text>
  <text x="84" y="682" class="sm" style="font-style:italic">Browser storage is device-local</text>

  <!-- Next layer -->
  <rect class="box" x="400" y="168" width="335" height="575"/>
  <rect x="400" y="168" width="335" height="9" rx="4" fill="#15a38a"/>
  <rect x="424" y="194" width="111" height="22" rx="11" fill="#15a38a"/><text x="479" y="209" text-anchor="middle" class="tag">NEXT.JS APP</text>
  <text x="424" y="251" class="h">Next.js 16 · App Router</text>
  <rect x="424" y="278" width="287" height="169" rx="13" fill="#eff7ff" stroke="#d5e7f6"/>
  <text x="444" y="311" class="h" style="font-size:17px">UI layer</text>
  <text x="444" y="342" class="t"><tspan x="444">React 19 dashboards + shared UI</tspan><tspan x="444" dy="25">Leaflet / OpenStreetMap maps</tspan><tspan x="444" dy="25">Client-side role experiences</tspan></text>
  <rect x="424" y="466" width="287" height="226" rx="13" fill="#effaf7" stroke="#ccebe3"/>
  <text x="444" y="500" class="h" style="font-size:17px">API route handlers</text>
  <text x="444" y="532" class="t"><tspan x="444">/api/sos · /api/hospitals</tspan><tspan x="444" dy="25">/api/holds · /api/rank</tspan><tspan x="444" dy="25">/api/notifications · /api/data</tspan><tspan x="444" dy="25">Zod validation + role guards</tspan><tspan x="444" dy="25">Better Auth session checks</tspan></text>

  <!-- domain services -->
  <rect class="box" x="810" y="168" width="355" height="575"/>
  <rect x="810" y="168" width="355" height="9" rx="4" fill="#8b5bd6"/>
  <rect x="834" y="194" width="134" height="22" rx="11" fill="#8b5bd6"/><text x="901" y="209" text-anchor="middle" class="tag">DOMAIN LAYER</text>
  <text x="834" y="251" class="h">CareLink services</text>
  <rect x="834" y="279" width="307" height="82" rx="12" fill="#f5f0fc" stroke="#e6daf7"/>
  <text x="854" y="312" class="h" style="font-size:16px">SOS dispatch</text><text x="854" y="339" class="sm">Offer → atomic accept → transport status</text>
  <rect x="834" y="375" width="307" height="97" rx="12" fill="#f5f0fc" stroke="#e6daf7"/>
  <text x="854" y="409" class="h" style="font-size:16px">Hospital ranking</text><text x="854" y="436" class="sm">Resources · route time · freshness · reliability</text><text x="854" y="457" class="sm">Explainable score breakdown</text>
  <rect x="834" y="486" width="307" height="97" rx="12" fill="#f5f0fc" stroke="#e6daf7"/>
  <text x="854" y="520" class="h" style="font-size:16px">Resource holds</text><text x="854" y="547" class="sm">Atomic reserve · confirm · release · escalate</text><text x="854" y="568" class="sm">Expiry worker releases reserved capacity</text>
  <rect x="834" y="597" width="307" height="91" rx="12" fill="#f5f0fc" stroke="#e6daf7"/>
  <text x="854" y="631" class="h" style="font-size:16px">Shared utilities</text><text x="854" y="658" class="sm">Auth · validation · response helpers · maps</text>

  <!-- Persistence -->
  <rect class="box" x="1240" y="168" width="300" height="575"/>
  <rect x="1240" y="168" width="300" height="9" rx="4" fill="#e99a31"/>
  <rect x="1264" y="194" width="106" height="22" rx="11" fill="#e99a31"/><text x="1317" y="209" text-anchor="middle" class="tag">DATABASE</text>
  <text x="1264" y="251" class="h">MongoDB</text>
  <text x="1264" y="284" class="sm">Better Auth adapter + app collections</text>
  <rect x="1264" y="309" width="252" height="194" rx="13" fill="#fff8ed" stroke="#f4dfbf"/>
  <text x="1284" y="344" class="t"><tspan x="1284">user</tspan><tspan x="1284" dy="31">hospitals</tspan><tspan x="1284" dy="31">resources</tspan><tspan x="1284" dy="31">holds</tspan><tspan x="1284" dy="31">operational snapshots</tspan></text>
  <line x1="1264" y1="530" x2="1516" y2="530" stroke="#eadfce"/>
  <text x="1264" y="565" class="h" style="font-size:16px">Consistency &amp; query support</text>
  <text x="1264" y="597" class="sm"><tspan x="1264">Transactions / atomic updates</tspan><tspan x="1264" dy="25">GeoJSON 2dsphere index</tspan><tspan x="1264" dy="25">Reservation + expiry indexes</tspan><tspan x="1264" dy="25">Change streams for live updates</tspan></text>

  <!-- Request paths -->
  <path class="flow" d="M325 383 H391"/><text x="356" y="365" text-anchor="middle" class="sm">HTTPS</text>
  <path class="flow" d="M735 552 H801"/><text x="768" y="534" text-anchor="middle" class="sm">validated calls</text>
  <path class="flow" d="M1165 407 H1231"/><text x="1198" y="389" text-anchor="middle" class="sm">read/write</text>
  <!-- realtime return path -->
  <path class="realtime dash" d="M1390 755 V802 H532 V755"/>
  <text x="947" y="794" text-anchor="middle" class="sm" style="fill:#117d6d;font-weight:700">MongoDB Change Stream → SSE → refresh connected clients</text>

  <!-- External provider and deployment -->
  <rect class="box" x="810" y="858" width="355" height="166"/>
  <rect x="810" y="858" width="355" height="8" rx="4" fill="#657d93"/>
  <text x="834" y="899" class="h">External route provider</text>
  <text x="834" y="932" class="t"><tspan x="834">Google Routes API (optional)</tspan><tspan x="834" dy="25">Travel-time estimate for ranking</tspan><tspan x="834" dy="25">Fallback: straight-line estimate</tspan></text>
  <path class="flow dash" d="M987 743 V848"/><text x="1003" y="823" class="sm">route lookup</text>

  <rect x="60" y="862" width="675" height="162" rx="18" fill="#17324d" filter="url(#shadow)"/>
  <text x="88" y="904" style="font:700 20px 'Segoe UI',Arial,sans-serif;fill:#fff">Deployment configuration</text>
  <text x="88" y="941" style="font:15px 'Segoe UI',Arial,sans-serif;fill:#e4edf5"><tspan x="88">MONGODB_URI · BETTER_AUTH_SECRET · optional Google Routes credentials</tspan><tspan x="88" dy="29">Production: schedule hold-expiry processing; configure HTTPS and secrets.</tspan></text>

  <text x="1540" y="1070" text-anchor="end" class="sm">Architecture reflects current implementation · See docs/remaining-work.md for open operational work</text>
</svg>
