<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">CareLink technical approach tree</title>
  <desc id="desc">A diagram of CareLink's user experience, API, domain services, MongoDB persistence, workflows, and production priorities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8ff"/><stop offset="1" stop-color="#edf5f3"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity=".10"/></filter>
    <style>
      .title{font:700 38px 'Segoe UI',Arial,sans-serif;fill:#142b45}.subtitle{font:16px 'Segoe UI',Arial,sans-serif;fill:#587089}
      .root{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#fff}.root2{font:14px 'Segoe UI',Arial,sans-serif;fill:#d9e9ff}
      .head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#17324d}.body{font:15px 'Segoe UI',Arial,sans-serif;fill:#334e68}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#587089}
      .connector{stroke:#94a9bc;stroke-width:2.5;fill:none}.card{fill:#fff;stroke:#dce6ef;stroke-width:1.2;rx:16;filter:url(#shadow)}
      .pill{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#fff;letter-spacing:.7px}
    </style>
  </defs>
  <rect width="1600" height="1320" fill="url(#bg)"/>
  <text x="80" y="66" class="title">CareLink · Technical Approach</text>
  <text x="80" y="96" class="subtitle">Current architecture, operating flows, and the work needed for production readiness</text>

  <rect x="590" y="125" width="420" height="92" rx="20" fill="#173f67" filter="url(#shadow)"/>
  <text x="800" y="166" text-anchor="middle" class="root">CARELINK</text>
  <text x="800" y="191" text-anchor="middle" class="root2">Role-based emergency coordination platform</text>

  <path class="connector" d="M800 217 V253 M175 253 H1425 M175 253 V278 M592 253 V278 M1008 253 V278 M1425 253 V278"/>

  <!-- architecture cards -->
  <g>
    <rect class="card" x="65" y="278" width="350" height="250"/>
    <rect x="65" y="278" width="350" height="10" rx="5" fill="#3878d4"/>
    <rect x="88" y="305" width="100" height="23" rx="11" fill="#3878d4"/><text x="138" y="321" text-anchor="middle" class="pill">EXPERIENCE</text>
    <text x="88" y="362" class="head">1 · User experience</text>
    <text x="88" y="395" class="body"><tspan x="88">Next.js 16 App Router · React 19 · TypeScript</tspan><tspan x="88" dy="27">Role dashboards: patient, dispatcher, driver,</tspan><tspan x="88" dy="22">hospital admin, and pharmacy</tspan><tspan x="88" dy="27">Shared components, maps, notifications, handoff</tspan><tspan x="88" dy="27">Client state: sample data → localStorage →</tspan><tspan x="88" dy="22">MongoDB snapshot reconciliation</tspan></text>
  </g>
  <g>
    <rect class="card" x="425" y="278" width="350" height="250"/>
    <rect x="425" y="278" width="350" height="10" rx="5" fill="#15a38a"/>
    <rect x="448" y="305" width="100" height="23" rx="11" fill="#15a38a"/><text x="498" y="321" text-anchor="middle" class="pill">API & ACCESS</text>
    <text x="448" y="362" class="head">2 · API and access control</text>
    <text x="448" y="395" class="body"><tspan x="448">Next.js route handlers under app/api</tspan><tspan x="448" dy="27">Better Auth sessions + server-side role checks</tspan><tspan x="448" dy="27">Zod validation and shared API responses</tspan><tspan x="448" dy="27">SOS · hospitals · holds · notifications · data</tspan><tspan x="448" dy="27">SSE/change stream for connected dashboards</tspan></text>
  </g>
  <g>
    <rect class="card" x="785" y="278" width="350" height="250"/>
    <rect x="785" y="278" width="350" height="10" rx="5" fill="#8b5bd6"/>
    <rect x="808" y="305" width="120" height="23" rx="11" fill="#8b5bd6"/><text x="868" y="321" text-anchor="middle" class="pill">DOMAIN LOGIC</text>
    <text x="808" y="362" class="head">3 · Domain services</text>
    <text x="808" y="395" class="body"><tspan x="808">Hold lifecycle: reserve, confirm, release,</tspan><tspan x="808" dy="22">expire, and escalate</tspan><tspan x="808" dy="27">Hospital ranking: resource match, travel,</tspan><tspan x="808" dy="22">freshness, and reliability</tspan><tspan x="808" dy="27">SOS dispatch + optional Google Routes ETA</tspan><tspan x="808" dy="27">Straight-line ETA fallback</tspan></text>
  </g>
  <g>
    <rect class="card" x="1145" y="278" width="390" height="250"/>
    <rect x="1145" y="278" width="390" height="10" rx="5" fill="#e99a31"/>
    <rect x="1168" y="305" width="105" height="23" rx="11" fill="#e99a31"/><text x="1220" y="321" text-anchor="middle" class="pill">PERSISTENCE</text>
    <text x="1168" y="362" class="head">4 · MongoDB</text>
    <text x="1168" y="395" class="body"><tspan x="1168">Shared connection pool + reconnect handling</tspan><tspan x="1168" dy="27">Users · hospitals · resources · holds</tspan><tspan x="1168" dy="27">GeoJSON + 2dsphere proximity index</tspan><tspan x="1168" dy="27">Atomic capacity updates prevent overbooking</tspan><tspan x="1168" dy="27">localStorage is device-local fallback only</tspan></text>
  </g>

  <path class="connector" d="M800 528 V563 M270 563 H1330 M270 563 V590 M800 563 V590 M1330 563 V590"/>
  <text x="80" y="578" class="small" style="font-weight:700;letter-spacing:1px">CORE OPERATING FLOWS</text>

  <g>
    <rect class="card" x="80" y="590" width="380" height="236"/>
    <text x="108" y="630" class="head">Emergency response</text>
    <text x="108" y="670" class="body"><tspan x="108">Patient SOS</tspan><tspan x="108" dy="25">↓</tspan><tspan x="108" dy="25">Available drivers → atomic acceptance</tspan><tspan x="108" dy="25">↓</tspan><tspan x="108" dy="25">Equipment-matched nearby hospitals</tspan><tspan x="108" dy="25">↓</tspan><tspan x="108" dy="25">Arrival → completion</tspan></text>
  </g>
  <g>
    <rect class="card" x="610" y="590" width="380" height="236"/>
    <text x="638" y="630" class="head">Hospital resource allocation</text>
    <text x="638" y="670" class="body"><tspan x="638">Rank hospitals against patient needs</tspan><tspan x="638" dy="25">↓</tspan><tspan x="638" dy="25">Pending hold atomically reserves capacity</tspan><tspan x="638" dy="25">↓</tspan><tspan x="638" dy="25">Hospital confirms or rejects</tspan><tspan x="638" dy="25">↓</tspan><tspan x="638" dy="25">Release + escalate on rejection/expiry</tspan></text>
  </g>
  <g>
    <rect class="card" x="1140" y="590" width="380" height="236"/>
    <text x="1168" y="630" class="head">Live coordination + pharmacy</text>
    <text x="1168" y="670" class="body"><tspan x="1168">MongoDB change stream / SSE</tspan><tspan x="1168" dy="25">→ refresh connected dashboards</tspan><tspan x="1168" dy="36">Pharmacy search and order UI exist</tspan><tspan x="1168" dy="25">→ approval/stock APIs remain incomplete</tspan><tspan x="1168" dy="36">Disconnected clients refetch persisted state</tspan></text>
  </g>

  <rect x="80" y="870" width="1440" height="365" rx="20" fill="#17324d" filter="url(#shadow)"/>
  <text x="115" y="918" style="font:700 23px 'Segoe UI',Arial,sans-serif;fill:#fff">Production readiness path</text>
  <text x="115" y="963" style="font:700 15px 'Segoe UI',Arial,sans-serif;fill:#89d9c6">CONFIGURE</text>
  <text x="115" y="993" style="font:15px 'Segoe UI',Arial,sans-serif;fill:#e4edf5"><tspan x="115">MongoDB URI · strong Better Auth secret · Google Routes credentials</tspan></text>
  <line x1="115" y1="1018" x2="1485" y2="1018" stroke="#456079"/>
  <text x="115" y="1055" style="font:700 15px 'Segoe UI',Arial,sans-serif;fill:#89d9c6">COMPLETE</text>
  <text x="115" y="1085" style="font:15px 'Segoe UI',Arial,sans-serif;fill:#e4edf5"><tspan x="115">Schedule hold expiry processing · finish pharmacist-approved stock/order workflow</tspan></text>
  <line x1="115" y1="1110" x2="1485" y2="1110" stroke="#456079"/>
  <text x="115" y="1147" style="font:700 15px 'Segoe UI',Arial,sans-serif;fill:#89d9c6">VERIFY BEFORE RELEASE</text>
  <text x="115" y="1178" style="font:15px 'Segoe UI',Arial,sans-serif;fill:#e4edf5"><tspan x="115">npm run build  ·  npm run lint  ·  npm test</tspan></text>
  <text x="1485" y="1210" text-anchor="end" style="font:13px 'Segoe UI',Arial,sans-serif;fill:#afc2d3">Details: docs/technical-approach-tree.md · docs/remaining-work.md</text>
</svg>
